# [project] table: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
[project]
name = "aws_lbd_art_builder_core"
# Bump before each release (https://semver.org/), then ``mise run inst`` to update ``uv.lock``.
version = "1.0.0"
description = "Shared infrastructure for building and deploying AWS Lambda artifacts — the core of a 1+N package family (pip, poetry, uv tool-specific sub-packages)."
# An SPDX license expression (PEP 639); keep ``LICENSE.txt`` in sync.
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license-and-license-files
# Valid identifiers: https://spdx.org/licenses/
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
maintainers = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
keywords = []
readme = "README.rst"
requires-python = ">=3.11,<4.0"
# Read: https://pypi.org/classifiers/
# NOTE: THIS PACKAGE DOESN'T SUPPORT WINDOWS
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# --- Dependencies ---
# Edit these lists, then ``mise run inst`` to update ``uv.lock`` and ``.venv``.
dependencies = [
    "soft-deps>=0.1.1,<1.0.0",
    "func-args>=1.0.1,<2.0.0",
]

# --- Optional dependencies (extras) ---
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#dependencies-optional-dependencies
# Each one must support every Python version in ``requires-python``.
[project.optional-dependencies]

# Note: also install these in CI test
upload = [
    "boto3>=1.42.9,<2.0.0",
    "s3pathlib>=3.0.0,<4.0.0",
]
# Note: also install these in CI test
publish = [
    "boto3>=1.42.9,<2.0.0",
    "s3pathlib>=3.0.0,<4.0.0",
    "simple_aws_lambda>=0.2.2,<1.0.0",
]

# local development
dev = [
    "rich>=14.3.4,<15.0.0",
    "boto3_stubs[s3,lambda,codeartifact]>=1.42.9,<2.0.0", # boto3 stubs for IDE autocompletion
]

# tests and coverage
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "moto>=5.1.10,<6.0.0", # mock AWS services
    "pip>=25.0,<30.0",
]

# docs build
doc = [
    "Sphinx>=8.2.3,<9.0.0", # held below 9 until its autodoc rewrite is verified
    "sphinx-copybutton>=0.5.2,<1.0.0", # copy button on code blocks
    "sphinx-design>=0.7.0,<1.0.0", # cards, tabs, grids
    "sphinx-jinja>=2.0.2,<3.0.0", # jinja in reST
    "furo==2025.12.19", # theme
    "pygments>=2.18.0,<3.0.0", # syntax highlighting
    "ipython>=8.18.1,<8.19.0", # notebook execution
    "ipykernel>=7.3.0,<8.0.0", # notebook kernel
    "nbsphinx>=0.9.8,<1.0.0", # notebooks as doc pages
    "rstobj>=2.0.0,<3.0.0", # reST from Python
    "docfly>=3.0.3,<4.0.0", # toctree and API reference
]

# mise tasks
mise = [
    "PyGithub>=2.8.0,<3.0.0", # GitHub API client
    "httpx2>=2.13.1,<3.0.0", # Codecov and Read the Docs APIs
]

[project.urls]
Homepage = "https://github.com/MacHu-GWU/aws_lbd_art_builder_core-project"
Documentation = "https://aws-lbd-art-builder-core.readthedocs.io/en/latest/"
Repository = "https://github.com/MacHu-GWU/aws_lbd_art_builder_core-project"
Issues = "https://github.com/MacHu-GWU/aws_lbd_art_builder_core-project/issues"
Changelog = "https://github.com/MacHu-GWU/aws_lbd_art_builder_core-project/blob/main/release-history.rst"
Download = "https://pypi.org/pypi/aws-lbd-art-builder-core#files"

# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts
[project.scripts]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "aws_lbd_art_builder_core*",
]
exclude = [
    "aws_lbd_art_builder_core.tests",
    "aws_lbd_art_builder_core.tests.*",
    "aws_lbd_art_builder_core.docs",
    "aws_lbd_art_builder_core.docs.*",
]

# --- ruff: ``mise run format`` / ``mise run lint`` ---
[tool.ruff]
extend-exclude = [
    "aws_lbd_art_builder_core/vendor",
    ".claude/skills/*/assets", # templates, not valid Python
]

[tool.ruff.lint.per-file-ignores]
# re-export modules
"**/__init__.py" = ["F401"]
"**/api.py" = ["F401"]

# --- pytest 9+ native table ---
# Read: https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
[tool.pytest]
testpaths = ["tests"]
# strict = true # only with a pinned pytest
# filterwarnings = ["error"]
# markers = ["slow: tests that take more than a few seconds"]

# --- Build (``mise run build``); setuptools 77+ for PEP 639 ``license`` ---
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
